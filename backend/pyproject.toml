[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyarena-backend"
version = "0.2.0"
description = "FastAPI backend for PyArena: Python playground and real-time coding competitions."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "aiosqlite==0.22.1",
  "alembic==1.20.0",
  "python-socketio==5.17.0",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "httpx==0.28.1",
  "redis==8.1.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aiohttp>=3.10",
  "fakeredis==2.39.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/"]
