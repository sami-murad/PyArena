# Install once:  pip install pre-commit && pre-commit install
# Run on everything:  pre-commit run --all-files   (or: make precommit)
# Hook repositories are pinned to commit SHAs (version in the comment); update
# them deliberately with `pre-commit autoupdate --freeze`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|md)$
      - id: end-of-file-fixer
        exclude: ^frontend/(public/stickers/|src/types/openapi\.d\.ts$)
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig allows comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0 (same as the pinned ruff)
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|judge-worker|database)/
      - id: ruff-format
        files: ^(backend|judge-worker|database)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend eslint
        entry: npm --prefix frontend run lint --silent
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck (includes the API contract test)
        entry: npm --prefix frontend run typecheck --silent
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
